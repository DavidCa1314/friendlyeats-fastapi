<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>FriendlyEats - Descubrimiento Gastronómico</title>
    
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "secondary": "#565e74",
              "on-secondary-fixed-variant": "#3f465c",
              "tertiary-fixed-dim": "#7bd0ff",
              "on-secondary-fixed": "#131b2e",
              "on-surface-variant": "#3f4850",
              "outline-variant": "#bfc7d2",
              "on-surface": "#0d1c2f",
              "surface-tint": "#006398",
              "on-tertiary-container": "#fcfcff",
              "surface-container": "#e6eeff",
              "secondary-container": "#dae2fd",
              "surface-variant": "#d5e3fd",
              "surface-dim": "#ccdbf4",
              "surface-container-lowest": "#ffffff",
              "primary-container": "#007bb9",
              "secondary-fixed-dim": "#bec6e0",
              "tertiary": "#006387",
              "tertiary-fixed": "#c4e7ff",
              "on-secondary-container": "#5c647a",
              "secondary-fixed": "#dae2fd",
              "primary": "#006194",
              "surface-bright": "#f8f9ff",
              "inverse-on-surface": "#ebf1ff",
              "on-tertiary-fixed": "#001e2c",
              "surface": "#f8f9ff",
              "primary-fixed-dim": "#93ccff",
              "on-primary": "#ffffff",
              "surface-container-highest": "#d5e3fd",
              "surface-container-high": "#dde9ff",
              "on-primary-container": "#fdfcff",
              "primary-fixed": "#cce5ff",
              "on-secondary": "#ffffff",
              "inverse-primary": "#93ccff",
              "outline": "#707881",
              "inverse-surface": "#233144",
              "on-tertiary-fixed-variant": "#004c69",
              "tertiary-container": "#007da9",
              "on-error": "#ffffff",
              "on-primary-fixed-variant": "#004b73",
              "error-container": "#ffdad6",
              "on-background": "#0d1c2f",
              "on-primary-fixed": "#001d31",
              "on-tertiary": "#ffffff",
              "error": "#ba1a1a",
              "background": "#f8f9ff",
              "surface-container-low": "#eff4ff",
              "on-error-container": "#93000a"
            },
            "borderRadius": {
              "DEFAULT": "0.125rem",
              "lg": "0.25rem",
              "xl": "0.5rem",
              "full": "0.75rem"
            },
            "spacing": {
              "space-xs": "0.25rem",
              "gutter-mobile": "0.75rem",
              "space-sm": "0.5rem",
              "space-md": "1rem",
              "margin-mobile": "1rem",
              "space-lg": "1.5rem",
              "margin": "1.5rem",
              "space-xl": "2.25rem",
              "gutter": "1rem"
            },
            "fontFamily": {
              "display-mobile": ["Plus Jakarta Sans"],
              "label-sm": ["Plus Jakarta Sans"],
              "body-lg": ["Inter"],
              "headline-sm": ["Plus Jakarta Sans"],
              "headline-lg": ["Plus Jakarta Sans"],
              "headline-md": ["Plus Jakarta Sans"],
              "display": ["Plus Jakarta Sans"],
              "label-lg": ["Plus Jakarta Sans"],
              "headline-lg-mobile": ["Plus Jakarta Sans"],
              "body-md": ["Inter"],
              "label-md": ["Plus Jakarta Sans"],
              "body-sm": ["Inter"]
            }
          }
        }
    }
    </script>
</head>
<body class="bg-background font-body-md text-body-md text-on-surface antialiased">
    <header class="fixed top-0 left-0 right-0 w-full z-50 bg-surface-container-lowest/90 backdrop-blur-xl shadow-sm">
        <div class="h-16 max-w-[1200px] mx-auto px-margin flex items-center justify-between">
            <div class="flex items-center gap-space-md">
                <a class="inline-flex items-center justify-center px-space-md py-space-xs rounded-xl bg-primary-fixed text-on-primary-fixed-variant hover:bg-primary hover:text-on-primary font-label-md text-label-md transition-colors" href="/">Inicio</a>
            </div>
            <div class="flex items-center justify-center">
                <a class="font-display text-headline-md tracking-tight text-on-surface flex items-center gap-space-xs" href="#">
                    <span class="text-primary">Friendly</span>Eats
                </a>
            </div>
            <div class="flex items-center gap-space-md">
                <a class="inline-flex items-center justify-center px-space-md py-space-xs rounded-xl bg-primary text-on-primary hover:bg-primary-container font-label-md text-label-md transition-colors" href="/restaurants/new">Registrar restaurante</a>
            </div>
        </div>
    </header>

    <main class="w-full pt-16 bg-background min-h-screen">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
